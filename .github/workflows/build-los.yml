name: build-los

# LineageOS 基线内核构建：Droidspaces + BBG + 游戏优化
# 触发：默认仅手动 workflow_dispatch（2026-11-27 起关闭 push 自动构建，避免误触发重建/覆盖 Release）
# 注意：下面的 push 触发是【临时一次性】的，用于 KASAN 关闭版本的重建，构建完成后会移除。
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-los.yml'

permissions:
  contents: write

concurrency:
  group: build-los
  cancel-in-progress: true

jobs:
  kernel:
    name: los-kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Prepare runner (free disk + build deps)
        run: bash los/scripts/prepare-runner.sh

      - name: Restore compiler cache
        id: cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: los/toolchain/clang-r563880c
          key: aosp-clang-r563880c-los-571ed3e20b5708cea1177d5072853fc5b85b6877

      - name: Fetch sources, compiler, patches
        id: prepare
        run: bash los/scripts/prepare.sh

      - name: Save compiler cache
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: los/toolchain/clang-r563880c
          key: aosp-clang-r563880c-los-571ed3e20b5708cea1177d5072853fc5b85b6877

      - name: Allocate link memory (LTO link / swap safety)
        run: |
          set -euo pipefail
          available=$(df -B1 --output=avail los | tail -1)
          swap_gib=$(( available / 1073741824 - 18 ))
          if (( swap_gib > 24 )); then swap_gib=24; fi
          if (( swap_gib < 8 )); then
            echo "Not enough free disk for a swap file (swap_gib=${swap_gib}); continuing without swap (ThinLTO fits runner RAM)"
            df -h los
            free -h
            exit 0
          fi
          sudo fallocate -l "${swap_gib}G" /swapfile-socrates
          sudo chmod 600 /swapfile-socrates
          sudo mkswap /swapfile-socrates >/dev/null
          sudo swapon /swapfile-socrates
          df -h los
          free -h

      - name: Build kernel (LOS base + features)
        id: build
        run: bash los/scripts/build.sh

      - name: Package boot.img / AnyKernel3
        id: package
        run: bash los/scripts/package.sh

      - name: Publish release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(python3 -c "import json;print(json.load(open('los/config/sources.lock.json'))['release_tag'])")
          echo "release tag: ${TAG}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "K60 Pro (socrates) LOS 基线 5.15 定制内核" \
              --notes-file "los/dist/RELEASE-los.md" || true
          fi
          gh release upload "$TAG" \
            los/dist/boot-los.img \
            los/dist/ak3-los.zip \
            los/dist/Image-los \
            los/dist/SHA256SUMS-los \
            los/dist/abi-report-los.json \
            los/dist/build-los.json \
            los/dist/kernel-los.config \
            --clobber || echo "!! release upload failed (rc=$?)"

      - name: Collect step outcomes
        if: always()
        run: |
          mkdir -p los/dist/ci-artifacts
          {
            echo "cache=${{ steps.cache.outcome }}"
            echo "prepare=${{ steps.prepare.outcome }}"
            echo "build=${{ steps.build.outcome }}"
            echo "package=${{ steps.package.outcome }}"
            echo "run=${GITHUB_RUN_ID}"
          } > los/dist/ci-artifacts/steps-los.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: los-kernel-${{ github.run_number }}
          path: los/dist/
          if-no-files-found: warn
          retention-days: 30
