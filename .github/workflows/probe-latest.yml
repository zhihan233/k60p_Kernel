name: probe-latest

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.latest/**'
      - '.github/workflows/probe-latest.yml'

permissions:
  contents: write

concurrency:
  group: probe-latest
  cancel-in-progress: true

jobs:
  probe:
    name: probe-latest-merge
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install host build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev patch git curl xz-utils \
            python3 make gcc g++ ca-certificates

      - name: Probe merge and patch applicability
        run: bash .latest/probe.sh

      - name: Publish probe artifacts
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan latest-probe >/dev/null 2>&1 || true
          git rm -rqf . --ignore-unmatch >/dev/null 2>&1 || true
          mkdir -p probe
          cp -a probe-out/. probe/ 2>/dev/null || true
          git add -Af probe
          if git commit -qm "probe artifacts: run ${GITHUB_RUN_ID}"; then
            git push -f origin HEAD:latest-probe
          else
            echo "nothing to commit"
          fi
