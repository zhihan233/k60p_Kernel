name: collect-run

on:
  push:
    branches: [ main ]
    paths:
      - '.collect/**'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect run info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          mkdir -p out
          while read -r RUN_ID; do
            [[ -n "$RUN_ID" ]] || continue
            gh run view "$RUN_ID" --json status,conclusion,jobs,createdAt,updatedAt > "out/run-${RUN_ID}.json" || true
            gh run view "$RUN_ID" --log > "out/run-${RUN_ID}.log" 2>"out/run-${RUN_ID}.log.err" || true
          done < .collect/run_id.txt
          ls -la out
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan run-logs-latest >/dev/null 2>&1 || true
          git rm -rqf . --ignore-unmatch >/dev/null 2>&1 || true
          git add -Af out >/dev/null
          if git commit -qm "run logs $(date -u +%Y%m%dT%H%M%SZ)"; then
            git push -f origin "HEAD:run-logs-latest"
          fi
