name: collect-run

on:
  push:
    branches: [ main ]
    paths:
      - '.collect/**'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect run info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          RUN_ID="$(cat .collect/run_id.txt)"
          mkdir -p out
          gh run view "$RUN_ID" --json status,conclusion,jobs,createdAt,updatedAt > out/run.json || true
          gh run view "$RUN_ID" --log > out/run.log 2>out/run.log.err || true
          ls -la out
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "run-logs-${RUN_ID}" >/dev/null 2>&1 || true
          git rm -rqf . --ignore-unmatch >/dev/null 2>&1 || true
          git add -Af out >/dev/null
          if git commit -qm "run logs ${RUN_ID}"; then
            git push -f origin "HEAD:run-logs-${RUN_ID}"
          fi
