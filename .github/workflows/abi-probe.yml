name: abi-probe

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.probe/**'
      - '.github/workflows/abi-probe.yml'

permissions:
  contents: write

concurrency:
  group: abi-probe
  cancel-in-progress: true

jobs:
  probe:
    name: probe-${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: f432-stock-andr14
            fragments: ""
          - name: f432-full-andr14
            fragments: "config/features-common.config,config/features-gaming.config"
    steps:
      - uses: actions/checkout@v4

      - name: Free disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift || true
          df -h /

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev dwarves cpio build-essential \
            patch zip unzip curl git python3 lz4 zstd kmod openssl file
          df -h /

      - name: Run ABI probe (Android clang r450784e, full LTO)
        id: probe
        env:
          PROBE_NAME: ${{ matrix.name }}
          PROBE_FRAGMENTS: ${{ matrix.fragments }}
          PROBE_TOOLCHAIN: andr14
          PROBE_LTO: full
          PROBE_KCFLAGS: ""
        run: |
          set -o pipefail
          bash .probe/probe.sh "$PROBE_NAME" "$PROBE_FRAGMENTS" "$PROBE_TOOLCHAIN" "$PROBE_LTO" 2>&1 | tee "probe-${PROBE_NAME}.log"

      - name: Publish probe result (even on failure)
        if: always()
        env:
          NAME: ${{ matrix.name }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          set -euo pipefail
          mkdir -p probe log
          {
            echo "name=${NAME}"
            echo "probe_outcome=${PROBE_OUTCOME}"
            echo "fragments=${{ matrix.fragments }}"
            echo "toolchain=andr14(r450784e) lto=full"
          } > log/summary.txt
          df -h >> log/summary.txt || true
          for f in dist/probe-* ; do
            [[ -e "$f" ]] && cp "$f" probe/ 2>/dev/null || true
          done
          for f in "probe-${NAME}.log" ; do
            [[ -e "$f" ]] && cp "$f" log/ 2>/dev/null || true
          done
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "abi-probe-log-${NAME}" >/dev/null 2>&1 || true
          git rm -rqf . --ignore-unmatch >/dev/null 2>&1 || true
          git add -Af probe log >/dev/null
          if git commit -qm "abi probe ${NAME}"; then
            git push -f origin "HEAD:abi-probe-log-${NAME}"
          fi
