name: test-env

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  env:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Runner info
        run: |
          uname -a
          nproc
          free -g
          df -h /
          echo "--- clang preinstalled ---"
          ls /usr/lib/llvm* 2>/dev/null || true
          clang --version || true

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-14 lld-14 llvm-14 gcc-aarch64-linux-gnu bc bison flex libssl-dev libelf-dev ccache zstd lz4 cpio rsync xxd
          echo "--- clang-14 ---"
          clang-14 --version
          echo "--- lld-14 ---"
          lld-14 --version || true
          echo "--- aarch64 gcc ---"
          aarch64-linux-gnu-gcc --version | head -1
          echo "--- python ---"
          python3 --version

      - name: Source download speed test
        run: |
          time curl -sSL --retry 2 -o ack.tar.gz "https://codeload.github.com/aosp-mirror/kernel_common/tar.gz/refs/heads/android13-5.15-lts"
          ls -lh ack.tar.gz
          echo "--- stable tarball ---"
          time curl -sSL --retry 2 -o stable.tar.xz "https://cdn.kernel.org/pub/linux/kernel/v5.x/linux-5.15.223.tar.xz" || true
          ls -lh stable.tar.xz || true
