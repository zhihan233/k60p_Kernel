name: debug-run

# 临时调试用：用 token 抓取指定 run 的 job 状态与失败日志，push 到 debug-logs 分支。
on:
  push:
    branches: [ main ]
    paths:
      - '.debug/**'
      - '.github/workflows/debug-run.yml'

permissions:
  actions: read
  contents: write

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect run info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          mkdir -p out
          while IFS= read -r RUN_ID; do
            [[ -n "$RUN_ID" ]] || continue
            [[ "$RUN_ID" == \#* ]] && continue
            gh run view "$RUN_ID" --json status,conclusion,jobs > "out/run-${RUN_ID}.json" || true
            gh run view "$RUN_ID" --log-failed > "out/run-${RUN_ID}-failed.log" 2>&1 || true
            gh run view "$RUN_ID" --log > "out/run-${RUN_ID}.log" 2>&1 || true
          done < .debug/run_id.txt
          ls -la out
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan debug-logs >/dev/null 2>&1 || true
          git rm -rqf . --ignore-unmatch >/dev/null 2>&1 || true
          git add -Af out >/dev/null
          if git commit -qm "debug logs $(date -u +%Y%m%dT%H%M%SZ)"; then
            git push -f origin "HEAD:debug-logs"
          fi
