name: build-latest-515

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.latest/**'
      - '.github/workflows/build-latest.yml'

permissions:
  contents: write

concurrency:
  group: build-latest-515-v2
  cancel-in-progress: true

jobs:
  latest:
    name: kernel-latest-5.15.226
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Prepare runner (free disk + build deps)
        id: runner
        run: |
          set -o pipefail
          mkdir -p dist
          bash scripts/prepare-runner.sh 2>&1 | tee "dist/prepare-runner-latest.log"

      - name: Restore compiler cache
        id: cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: toolchain/clang-r563880c
          key: aosp-clang-r563880c-571ed3e20b5708cea1177d5072853fc5b85b6877

      - name: Merge ACK + stable 5.15.226, fetch toolchain, apply patches
        id: prepare
        run: |
          set -o pipefail
          mkdir -p dist
          bash .latest/prepare-latest.sh 2>&1 | tee "dist/prepare-latest.log"

      - name: Save compiler cache
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: toolchain/clang-r563880c
          key: aosp-clang-r563880c-571ed3e20b5708cea1177d5072853fc5b85b6877

      - name: Allocate link memory (Full LTO)
        id: swap
        run: |
          set -euo pipefail
          available=$(df -B1 --output=avail . | tail -1)
          swap_gib=$(( available / 1073741824 - 18 ))
          if (( swap_gib > 24 )); then swap_gib=24; fi
          if (( swap_gib < 8 )); then
            echo "Insufficient disk (swap_gib=${swap_gib})"
            df -h .
            exit 1
          fi
          sudo fallocate -l "${swap_gib}G" /swapfile-socrates
          sudo chmod 600 /swapfile-socrates
          sudo mkswap /swapfile-socrates >/dev/null
          sudo swapon /swapfile-socrates
          df -h .
          free -h

      - name: Build 5.15.226 kernel and verify module ABI
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          bash .latest/build-latest.sh

      - name: Package boot.img and AnyKernel3
        id: package
        if: always()
        run: bash .latest/package-latest.sh

      - name: Collect step outcomes
        if: always()
        env:
          OUTCOME_RUNNER: ${{ steps.runner.outcome }}
          OUTCOME_PREPARE: ${{ steps.prepare.outcome }}
          OUTCOME_SWAP: ${{ steps.swap.outcome }}
          OUTCOME_BUILD: ${{ steps.build.outcome }}
          OUTCOME_PACKAGE: ${{ steps.package.outcome }}
        run: |
          mkdir -p dist/ci-artifacts
          {
            echo "variant=latest"
            echo "runner=${OUTCOME_RUNNER}"
            echo "prepare=${OUTCOME_PREPARE}"
            echo "swap=${OUTCOME_SWAP}"
            echo "build=${OUTCOME_BUILD}"
            echo "package=${OUTCOME_PACKAGE}"
          } > "dist/ci-artifacts/steps-latest.txt"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-latest
          path: dist/
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: publish-latest
    needs: latest
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Publish latest artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .latest/publish-latest.sh
