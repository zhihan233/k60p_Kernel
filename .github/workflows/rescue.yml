name: rescue-publish

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.rescue/**'
      - '.github/workflows/rescue.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: rescue-publish
  cancel-in-progress: false

jobs:
  rescue:
    name: publish-standard-from-run
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download standard artifact from build run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download 45388412166 --repo "${{ github.repository }}" -n dist-standard -D dist || true
          find dist -maxdepth 2 -type f | head -50
          if [ ! -f dist/Image-standard ]; then
            echo "!! standard image not found in artifact"
            # 再尝试合并下载全部
            gh run download 45388412166 --repo "${{ github.repository }}" -D dist-all || true
            cp -a dist-all/dist-standard/. dist/ 2>/dev/null || true
          fi
          ls -la dist | head -30

      - name: Publish to release and ci-artifacts branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x scripts/publish.sh
          bash scripts/publish.sh
