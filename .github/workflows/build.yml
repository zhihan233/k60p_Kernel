name: build-kernel

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build.yml'
      - 'config/**'
      - 'patches/**'
      - 'scripts/**'
      - 'evidence/**'

permissions:
  contents: write

concurrency:
  group: build-kernel
  cancel-in-progress: false

jobs:
  kernel:
    name: kernel-${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        variant: [standard, gaming]
    steps:
      - uses: actions/checkout@v4

      - name: Prepare runner (free disk + build deps)
        run: bash scripts/prepare-runner.sh

      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: toolchain/clang-r563880c
          key: aosp-clang-r563880c-571ed3e20b5708cea1177d5072853fc5b85b6877

      - name: Fetch sources, compiler, patches
        env:
          VARIANT: ${{ matrix.variant }}
        run: bash scripts/prepare.sh

      - name: Save compiler cache
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: toolchain/clang-r563880c
          key: aosp-clang-r563880c-571ed3e20b5708cea1177d5072853fc5b85b6877

      - name: Allocate link memory (Full LTO)
        run: |
          set -euo pipefail
          available=$(df -B1 --output=avail . | tail -1)
          swap_gib=$(( available / 1073741824 - 18 ))
          if (( swap_gib > 24 )); then swap_gib=24; fi
          if (( swap_gib < 8 )); then
            echo 'Insufficient disk for Full LTO output and swap'
            df -h .
            exit 1
          fi
          sudo fallocate -l "${swap_gib}G" /swapfile-socrates
          sudo chmod 600 /swapfile-socrates
          sudo mkswap /swapfile-socrates >/dev/null
          sudo swapon /swapfile-socrates
          df -h .
          free -h

      - name: Build kernel and verify vendor module ABI
        id: build
        continue-on-error: true
        env:
          VARIANT: ${{ matrix.variant }}
        run: bash scripts/build.sh

      - name: Package Image / boot.img / AnyKernel3
        if: always()
        env:
          VARIANT: ${{ matrix.variant }}
        run: bash scripts/package.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.variant }}
          path: dist/
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: publish
    needs: kernel
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Publish to ci-artifacts branch and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish.sh
